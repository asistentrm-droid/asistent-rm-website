  <circle cx="50" cy="50" r="45" fill="none" class="brain-stroke" stroke-width="3"/>
  <path class="brain-fill" d="M30,35 Q35,28 40,30 T50,28 T60,30 Q65,28 70,35 Q72,42 70,48 Q75,52 72,58 Q70,65 65,68 T55,70 T45,70 T35,68 Q30,65 28,58 Q25,52 30,48 Q28,42 30,35 Z"/>
  <circle cx="42" cy="45" r="3" class="brain-fill"/>
  <circle cx="58" cy="45" r="3" class="brain-fill"/>
  <path class="brain-stroke" d="M35,50 Q40,48 45,50 T55,50 Q60,48 65,50" fill="none" stroke-width="2.5" stroke-linecap="round"/>
</svg>
