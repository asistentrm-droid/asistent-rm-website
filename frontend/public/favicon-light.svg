<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Black RM Brain Logo for Light Theme -->
  <g fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer brain circle -->
    <circle cx="100" cy="100" r="85" stroke-width="4"/>
    
    <!-- Brain structure -->
    <path d="M 60 70 Q 70 55 85 60 Q 95 50 105 55 Q 115 50 125 60 Q 140 55 150 70" fill="none" stroke-width="3"/>
    <path d="M 60 90 Q 70 80 85 85 Q 95 78 105 82 Q 115 78 125 85 Q 140 80 150 90" fill="none" stroke-width="3"/>
    <path d="M 55 110 Q 65 105 80 108 Q 100 102 120 108 Q 135 105 145 110" fill="none" stroke-width="3"/>
    <path d="M 60 130 Q 80 120 100 125 Q 120 120 140 130" fill="none" stroke-width="3"/>
    
    <!-- Brain lobes -->
    <ellipse cx="75" cy="85" rx="20" ry="25" fill="none" stroke-width="2.5"/>
    <ellipse cx="125" cy="85" rx="20" ry="25" fill="none" stroke-width="2.5"/>
    
    <!-- Neural connections -->
    <circle cx="100" cy="100" r="8" fill="#000000"/>
    <line x1="92" y1="95" x2="80" y2="85" stroke-width="2"/>
    <line x1="108" y1="95" x2="120" y2="85" stroke-width="2"/>
    <line x1="100" y1="108" x2="100" y2="125" stroke-width="2"/>
  </g>
</svg>
